{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="posts">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Date }}{{ if not .IsZero }}<span class="meta">{{ .Format "2006-01-02" }}</span>{{ end }}{{ end }}
    {{ with .Description }}<br><span class="meta">{{ . }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
